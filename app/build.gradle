plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.touchswipe'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.touchswipe"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Shizuku API - permite ejecutar comandos con permisos elevados
    // sin necesidad de root. El servicio en sí lo provee la app Shizuku
    // instalada en el dispositivo; aquí solo necesitamos el cliente.
    implementation 'dev.rikka.shizuku:api:13.1.5'
}
