name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Decodificar keystore desde el secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > touchswipe-release.jks

      - name: Compilar APK release firmado
        env:
          RELEASE_STORE_FILE: touchswipe-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=$RELEASE_STORE_FILE \
            -PRELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD \
            -PRELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS \
            -PRELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD \
            --stacktrace

      - name: Subir APK firmado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: touch-swipe-service-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Limpiar keystore del runner
        if: always()
        run: rm -f touchswipe-release.jks
